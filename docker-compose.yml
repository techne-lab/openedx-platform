# Docker Compose for Open edX Platform – development environment
#
# Quick start:
#   make create   # build images and run database provisioning
#   make up       # start all services
#
# Services:
#   mysql       – MySQL 8.0 (LMS + CMS relational data)
#   mongo       – MongoDB 4.4 (modulestore / contentstore)
#   memcached   – Memcached (caches)
#   elasticsearch – Elasticsearch 7.17 (course search)
#   lms         – Open edX LMS  (http://localhost:18000)
#   cms         – Open edX Studio (http://localhost:18010)
#   lms_worker  – Celery worker for LMS background tasks
#   cms_worker  – Celery worker for CMS background tasks

services:

  # --------------------------------------------------------------------------
  # Infrastructure
  # --------------------------------------------------------------------------

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: edxapp
      MYSQL_USER: edxapp
      MYSQL_PASSWORD: edxapp_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-u", "edxapp", "-pedxapp_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:4.4
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  memcached:
    image: memcached:1.6-alpine
    ports:
      - "11211:11211"

  elasticsearch:
    image: elasticsearch:7.17.20
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # --------------------------------------------------------------------------
  # Application services
  # --------------------------------------------------------------------------

  lms:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    image: openedx-platform:latest
    command: lms
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      memcached:
        condition: service_started
    environment:
      SERVICE_VARIANT: lms
      DJANGO_SETTINGS_MODULE: lms.envs.devstack
      LMS_CFG: /edx/etc/lms.env.yml
      CMS_CFG: /edx/etc/cms.env.yml
      REVISION_CFG: /edx/etc/revision.yml
      MYSQL_HOST: mysql
      MONGO_HOST: mongo
      MEMCACHE_HOST: memcached
      LMS_WORKERS: "4"
    volumes:
      - ./docker/lms.env.yml:/edx/etc/lms.env.yml:ro
      - ./docker/cms.env.yml:/edx/etc/cms.env.yml:ro
      - ./docker/revision.yml:/edx/etc/revision.yml:ro
      - lms_static:/edx/var/edxapp/staticfiles
      - edxapp_media:/edx/var/edxapp/media
      - edxapp_data:/edx/var/data
      - ace_messages:/edx/src/ace_messages
    ports:
      - "18000:8000"
    restart: unless-stopped

  cms:
    image: openedx-platform:latest
    command: cms
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      memcached:
        condition: service_started
      lms:
        condition: service_started
    environment:
      SERVICE_VARIANT: cms
      DJANGO_SETTINGS_MODULE: cms.envs.devstack
      LMS_CFG: /edx/etc/lms.env.yml
      CMS_CFG: /edx/etc/cms.env.yml
      REVISION_CFG: /edx/etc/revision.yml
      MYSQL_HOST: mysql
      MONGO_HOST: mongo
      MEMCACHE_HOST: memcached
      CMS_WORKERS: "2"
    volumes:
      - ./docker/lms.env.yml:/edx/etc/lms.env.yml:ro
      - ./docker/cms.env.yml:/edx/etc/cms.env.yml:ro
      - ./docker/revision.yml:/edx/etc/revision.yml:ro
      - cms_static:/edx/var/edxapp/staticfiles
      - edxapp_media:/edx/var/edxapp/media
      - edxapp_data:/edx/var/data
      - ace_messages:/edx/src/ace_messages
    ports:
      - "18010:8010"
    restart: unless-stopped

  lms_worker:
    image: openedx-platform:latest
    command: lms_worker
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      SERVICE_VARIANT: lms
      DJANGO_SETTINGS_MODULE: lms.envs.devstack
      LMS_CFG: /edx/etc/lms.env.yml
      CMS_CFG: /edx/etc/cms.env.yml
      REVISION_CFG: /edx/etc/revision.yml
      MYSQL_HOST: mysql
      MONGO_HOST: mongo
      MEMCACHE_HOST: memcached
    volumes:
      - ./docker/lms.env.yml:/edx/etc/lms.env.yml:ro
      - ./docker/cms.env.yml:/edx/etc/cms.env.yml:ro
      - ./docker/revision.yml:/edx/etc/revision.yml:ro
      - edxapp_media:/edx/var/edxapp/media
      - edxapp_data:/edx/var/data
      - ace_messages:/edx/src/ace_messages
    restart: unless-stopped

  cms_worker:
    image: openedx-platform:latest
    command: cms_worker
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      SERVICE_VARIANT: cms
      DJANGO_SETTINGS_MODULE: cms.envs.devstack
      LMS_CFG: /edx/etc/lms.env.yml
      CMS_CFG: /edx/etc/cms.env.yml
      REVISION_CFG: /edx/etc/revision.yml
      MYSQL_HOST: mysql
      MONGO_HOST: mongo
      MEMCACHE_HOST: memcached
    volumes:
      - ./docker/lms.env.yml:/edx/etc/lms.env.yml:ro
      - ./docker/cms.env.yml:/edx/etc/cms.env.yml:ro
      - ./docker/revision.yml:/edx/etc/revision.yml:ro
      - edxapp_media:/edx/var/edxapp/media
      - edxapp_data:/edx/var/data
      - ace_messages:/edx/src/ace_messages
    restart: unless-stopped

# --------------------------------------------------------------------------
# Named volumes
# --------------------------------------------------------------------------
volumes:
  mysql_data:
  mongo_data:
  elasticsearch_data:
  lms_static:
  cms_static:
  edxapp_media:
  edxapp_data:
  ace_messages:
