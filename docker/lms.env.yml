# LMS configuration for Docker Compose development environment.
#
# This file is read by lms/envs/production.py (and in turn devstack.py)
# via the LMS_CFG environment variable.
#
# Keys here override the defaults set in lms/envs/common.py.

# ------------------------------------------------------------------
# Site identity
# ------------------------------------------------------------------
PLATFORM_NAME: "Open edX (Docker Dev)"
LMS_BASE: "localhost:18000"
CMS_BASE: "localhost:18010"
SITE_NAME: "localhost:18000"
LMS_ROOT_URL: "http://localhost:18000"
LMS_INTERNAL_ROOT_URL: "http://lms:8000"

# ------------------------------------------------------------------
# Security
# ------------------------------------------------------------------
SECRET_KEY: "docker-dev-secret-key-change-in-production"
ALLOWED_HOSTS:
  - "*"

# ------------------------------------------------------------------
# MySQL databases
# ------------------------------------------------------------------
DATABASES:
  default:
    ENGINE: django.db.backends.mysql
    HOST: mysql
    PORT: "3306"
    NAME: edxapp
    USER: edxapp
    PASSWORD: edxapp_password
    ATOMIC_REQUESTS: true
    CONN_MAX_AGE: 0
    OPTIONS: {}
  read_replica:
    ENGINE: django.db.backends.mysql
    HOST: mysql
    PORT: "3306"
    NAME: edxapp
    USER: edxapp
    PASSWORD: edxapp_password
    CONN_MAX_AGE: 0
    OPTIONS: {}
  student_module_history:
    ENGINE: django.db.backends.mysql
    HOST: mysql
    PORT: "3306"
    NAME: edxapp_csmh
    USER: edxapp
    PASSWORD: edxapp_password
    CONN_MAX_AGE: 0
    OPTIONS: {}

# ------------------------------------------------------------------
# Memcached caches
# ------------------------------------------------------------------
CACHES:
  default:
    BACKEND: django.core.cache.backends.memcached.PyMemcacheCache
    LOCATION:
      - "memcached:11211"
    KEY_PREFIX: default
    KEY_FUNCTION: "common.djangoapps.util.memcache.safe_key"
    VERSION: "1"
    OPTIONS:
      no_delay: true
      ignore_exc: true
      use_pooling: true
      connect_timeout: 0.5
  general:
    BACKEND: django.core.cache.backends.memcached.PyMemcacheCache
    LOCATION:
      - "memcached:11211"
    KEY_PREFIX: general
    KEY_FUNCTION: "common.djangoapps.util.memcache.safe_key"
    OPTIONS:
      no_delay: true
      ignore_exc: true
      use_pooling: true
      connect_timeout: 0.5
  configuration:
    BACKEND: django.core.cache.backends.memcached.PyMemcacheCache
    LOCATION:
      - "memcached:11211"
    KEY_PREFIX: configuration
    KEY_FUNCTION: "common.djangoapps.util.memcache.safe_key"
    OPTIONS:
      no_delay: true
      ignore_exc: true
      use_pooling: true
      connect_timeout: 0.5
  celery:
    BACKEND: django.core.cache.backends.memcached.PyMemcacheCache
    LOCATION:
      - "memcached:11211"
    KEY_PREFIX: celery
    TIMEOUT: "7200"
    KEY_FUNCTION: "common.djangoapps.util.memcache.safe_key"
    OPTIONS:
      no_delay: true
      ignore_exc: true
      use_pooling: true
      connect_timeout: 0.5
  course_structure_cache:
    BACKEND: django.core.cache.backends.memcached.PyMemcacheCache
    LOCATION:
      - "memcached:11211"
    KEY_PREFIX: course_structure
    TIMEOUT: "604800"
    KEY_FUNCTION: "common.djangoapps.util.memcache.safe_key"
    OPTIONS:
      no_delay: true
      ignore_exc: true
      use_pooling: true
      connect_timeout: 0.5
  mongo_metadata_inheritance:
    BACKEND: django.core.cache.backends.memcached.PyMemcacheCache
    LOCATION:
      - "memcached:11211"
    KEY_PREFIX: mongo_metadata_inheritance
    TIMEOUT: 300
    KEY_FUNCTION: "common.djangoapps.util.memcache.safe_key"
    OPTIONS:
      no_delay: true
      ignore_exc: true
      use_pooling: true
      connect_timeout: 0.5
  staticfiles:
    BACKEND: django.core.cache.backends.memcached.PyMemcacheCache
    LOCATION:
      - "memcached:11211"
    KEY_PREFIX: staticfiles_general
    KEY_FUNCTION: "common.djangoapps.util.memcache.safe_key"
    OPTIONS:
      no_delay: true
      ignore_exc: true
      use_pooling: true
      connect_timeout: 0.5

# ------------------------------------------------------------------
# MongoDB – modulestore and contentstore
# ------------------------------------------------------------------
CONTENTSTORE:
  ENGINE: xmodule.contentstore.mongo.MongoContentStore
  DOC_STORE_CONFIG:
    db: edxapp
    host: mongo
    port: 27017
    replicaSet: ""
    user: ""
    password: ""
    ssl: false
    auth_source: null
    socketTimeoutMS: 6000
    connectTimeoutMS: 2000
    collection: modulestore
  OPTIONS:
    db: edxapp
    host: mongo
    port: 27017
    user: ""
    password: ""
    ssl: false
    auth_source: null
  ADDITIONAL_OPTIONS: {}

DOC_STORE_CONFIG:
  db: edxapp
  host: mongo
  port: 27017
  replicaSet: ""
  user: ""
  password: ""
  ssl: false
  auth_source: null
  socketTimeoutMS: 6000
  connectTimeoutMS: 2000
  collection: modulestore

# ------------------------------------------------------------------
# Email (file-based for development)
# ------------------------------------------------------------------
EMAIL_BACKEND: "django.core.mail.backends.filebased.EmailBackend"
EMAIL_FILE_PATH: "/edx/src/ace_messages/"

# ------------------------------------------------------------------
# Static / media files
# ------------------------------------------------------------------
STATIC_ROOT_BASE: "/edx/var/edxapp/staticfiles"
MEDIA_ROOT: "/edx/var/edxapp/media/"

# ------------------------------------------------------------------
# Data directories
# ------------------------------------------------------------------
DATA_DIR: "/edx/var/data"
LOG_DIR: "/edx/var/log/edxapp"
LOGGING_ENV: "docker"

# ------------------------------------------------------------------
# Session / cookie
# ------------------------------------------------------------------
SESSION_COOKIE_DOMAIN: null
SESSION_COOKIE_SECURE: false
CSRF_COOKIE_SECURE: false

# ------------------------------------------------------------------
# Feature flags
# ------------------------------------------------------------------
FEATURES:
  ENABLE_DJANGO_ADMIN_SITE: true
  ENABLE_DISCUSSION_SERVICE: true

# ------------------------------------------------------------------
# Celery (eager mode for dev – no broker required)
# ------------------------------------------------------------------
CELERY_ALWAYS_EAGER: true
CLEAR_REQUEST_CACHE_ON_TASK_COMPLETION: false
